<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🏪 برنامج إدارة المحل</span>
            <a href="index.html" class="btn btn-light">الرئيسية</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center mb-4">👥 إدارة العملاء</h2>

        <div class="card p-4 mb-4">
            <h4 class="mb-3">إضافة عميل جديد</h4>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">اسم العميل</label>
                    <input type="text" id="customerName" class="form-control" placeholder="اسم العميل">
                </div>
                <div class="col-md-4">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="text" id="customerPhone" class="form-control" placeholder="01xxxxxxxxx">
                </div>
                <div class="col-md-4">
                    <label class="form-label">العنوان</label>
                    <input type="text" id="customerAddress" class="form-control" placeholder="العنوان">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" onclick="addCustomer()">➕ إضافة العميل</button>
                </div>
            </div>
        </div>
        <div class="card p-4">
            <h4 class="mb-3">قائمة العملاء</h4>
            <div class="table-responsive">
                <table class="table table-bordered text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>اسم العميل</th>
                            <th>رقم الهاتف</th>
                            <th>العنوان</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="customersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
