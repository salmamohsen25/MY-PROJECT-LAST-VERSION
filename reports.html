<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>التقارير</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">
                📊 التقارير
            </span>

            <a href="index.html" class="btn btn-light">
                الرئيسية
            </a>
        </div>
    </nav>



    <div class="container mt-4">

        <h3 class="mb-4">
            📊 تقرير المبيعات
        </h3>
        <div class="row mb-4">

            <div class="col-md-5">
                <label class="form-label">من تاريخ</label>
                <input type="date" id="fromDate" class="form-control">
            </div>

            <div class="col-md-5">
                <label class="form-label">إلى تاريخ</label>
                <input type="date" id="toDate" class="form-control">
            </div>

            <div class="col-md-2 d-flex align-items-end gap-2">

                <button class="btn btn-primary w-100" onclick="filterReports()">
                    بحث
                </button>

                <button class="btn btn-secondary w-100" onclick="resetReports()">
                    عرض الكل
                </button>

            </div>

        </div>
        <div class="col-md-4">
            <button class="btn btn-success w-100" onclick="printReports()">
                🖨️ طباعة التقرير
            </button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-success w-100" onclick="exportReports()">
                📊 تصدير Excel
            </button>
        </div>

        <div class="row g-3">


            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">

                        <h5>🧾 عدد الفواتير</h5>

                        <h2 id="totalInvoices">
                            0
                        </h2>

                    </div>
                </div>
            </div>



            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">

                        <h5>💰 إجمالي المبيعات</h5>

                        <h2 id="totalSales">
                            0 ج.م
                        </h2>

                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">

                        <h5>📈 إجمالي الأرباح</h5>

                        <h2 id="totalProfit">
                            0 ج.م
                        </h2>

                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">

                        <h5>💸 إجمالي المصروفات</h5>

                        <h2 id="totalExpenses">
                            0 ج.م
                        </h2>

                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">

                        <h5>💵 صافي الربح</h5>

                        <h2 id="netProfit">
                            0 ج.م
                        </h2>

                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>قيمة المخزون</h5>
                        <h3 id="stockValue">0 ج.م</h3>
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">

                        <h5>📦 المنتجات المباعة</h5>

                        <h2 id="totalProductsSold">
                            0
                        </h2>

                    </div>
                </div>
            </div>

        </div>

    </div>
    <div class="card mt-4 shadow-sm">

        <div class="card-body">

            <h4 class="mb-3">
                📦 المنتجات الأكثر مبيعًا
            </h4>

            <div class="table-responsive">

                <table class="table table-bordered table-striped text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>المنتج</th>
                            <th>الكمية المباعة</th>
                        </tr>
                    </thead>

                    <tbody id="bestProductsTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>
    <style>
        @media print {

            button,
            input {
                display: none !important;
            }

        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
