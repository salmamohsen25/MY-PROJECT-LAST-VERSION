<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - إدارة المحل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <span style="font-size: 50px;">🏪</span>
            <h3 class="mt-2">تسجيل الدخول</h3>
            <p class="text-muted">برنامج إدارة المحل</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">نوع الحساب</label>
                <select id="userRole" class="form-select">
                    <option value="admin">مدير (Admin)</option>
                    <option value="cashier">كاشير (Cashier)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" id="username" class="form-control" placeholder="أدخلي اسم المستخدم" required>
            </div>

            <div class="mb-3">
                <label class="form-label">كلمة السر</label>
                <input type="password" id="password" class="form-control" placeholder="أدخلي كلمة السر" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">دخول 🔑</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
