<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنتجات</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <span class="navbar-brand">
                🏪 برنامج إدارة المحل
            </span>

            <a href="index.html" class="btn btn-light">
                الرئيسية
            </a>

        </div>
    </nav>


    <div class="container mt-4">

        <h2 class="text-center mb-4">
            📦 إدارة المنتجات
        </h2>

        <div class="card p-4 mb-4">

            <h4 class="mb-3">
                إضافة منتج جديد
            </h4>

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">
                        اسم المنتج
                    </label>

                    <input type="text" id="productName" class="form-control" placeholder="مثال: قلم">
                </div>


                <div class="col-md-4">
                    <label class="form-label">
                        التصنيف
                    </label>

                    <input type="text" id="productCategory" class="form-control" placeholder="مثال: أدوات مكتبية">
                </div>


                <div class="col-md-4">
                    <label class="form-label">
                        الكود
                    </label>

                    <input type="text" id="productCode" class="form-control" placeholder="مثال: P001">
                </div>


                <div class="col-md-4">
                    <label class="form-label">
                        سعر الشراء
                    </label>

                    <input type="number" id="buyPrice" class="form-control" placeholder="0">
                </div>


                <div class="col-md-4">
                    <label class="form-label">
                        سعر البيع
                    </label>

                    <input type="number" id="sellPrice" class="form-control" placeholder="0">
                </div>


                <div class="col-md-4">
                    <label class="form-label">
                        الكمية
                    </label>

                    <input type="number" id="quantity" class="form-control" placeholder="0">
                </div>


                <div class="col-12">

                    <button class="btn btn-primary" onclick="addProduct()">

                        ➕ إضافة المنتج

                    </button>

                </div>

            </div>

        </div>

        <div class="card p-4">

            <h4 class="mb-3">
                قائمة المنتجات
            </h4>
            <div class="mb-3">

    <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="🔍 ابحثي عن اسم المنتج أو الكود..."
        oninput="searchProducts()">

</div>

            <div class="table-responsive">

                <table class="table table-bordered text-center">

                    <thead class="table-dark">

                        <tr>
                            <th>الكود</th>
                            <th>المنتج</th>
                            <th>التصنيف</th>
                            <th>سعر الشراء</th>
                            <th>سعر البيع</th>
                            <th>الكمية</th>
                            <th>الإجراء</th>
                        </tr>

                    </thead>

                    <tbody id="productsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
