<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المبيعات</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>


  <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">
                🏪 برنامج إدارة المحل
            </span>
            <span id="dateTime" class="text-white fw-bold mx-auto"></span>

            <a href="index.html" class="btn btn-light">
                الرئيسية
            </a>
        </div>
    </nav>
    <script>
        function startClock() {
            var clockElement = document.getElementById("dateTime");
            if (clockElement) {
                var now = new Date();
                clockElement.innerText = now.toLocaleString("ar-EG", {
                    weekday: "long",
                    year: "numeric",
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                });
            }
        }
        setInterval(startClock, 1000);
        startClock();
    </script>


    <div class="container mt-4">

        <h2 class="text-center mb-4">
            🛒 المبيعات
        </h2>



        <div class="card p-4 mb-4">

            <h4 class="mb-3">
                إضافة منتج للفاتورة
            </h4>

            <div class="row g-3">

               <div class="col-md-6">

    <label class="form-label">
        المنتج
    </label>

    <select
        id="saleProduct"
        class="form-select">

    </select>

</div>


                <div class="col-md-3">

                    <label class="form-label">
                        الكمية
                    </label>

                    <input type="number" id="saleQuantity" class="form-control" min="1" value="1">

                </div>


                <div class="col-md-3 d-flex align-items-end">

                    <button class="btn btn-primary w-100" onclick="addToInvoice()">

                        ➕ إضافة للفاتورة

                    </button>

                </div>

            </div>

        </div>




        <div class="card p-4">

            <h4 class="mb-3">
                🧾 الفاتورة
            </h4>


            <div class="table-responsive">

                <table class="table table-bordered text-center">

                    <thead class="table-dark">

                        <tr>

                            <th>
                                المنتج
                            </th>

                            <th>
                                السعر
                            </th>

                            <th>
                                الكمية
                            </th>

                            <th>
                                الإجمالي
                            </th>

                            <th>
                                حذف
                            </th>

                        </tr>

                    </thead>


                    <tbody id="invoiceTable">

                    </tbody>

                </table>

            </div>




            <div class="text-start mt-3">

                <h4>
                    إجمالي الفاتورة:
                    <span id="invoiceTotal">
                        0
                    </span>
                    ج.م
                </h4>

            </div>


            <button class="btn btn-success mt-3" onclick="completeSale()">

                💰 إتمام البيع

            </button>

        </div>


        <div class="text-center my-4">

            <a href="sales-history.html" class="btn btn-outline-primary">
                🧾 عرض جميع الفواتير
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
